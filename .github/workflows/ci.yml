name: GhostBoot CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK r28
        run: |
          ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          yes | sdkmanager "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
      - name: Build Zygisk .so (4 ABIs)
        run: |
          cd native
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk -j4
          ls -la libs/*/
      - name: Syntax check (host g++ parse)
        run: |
          g++ -std=c++17 -fsyntax-only -DANDROID -I native/jni native/jni/config.cpp || true

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
